name: "units-test"
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

# Least-privilege default: no job here needs to write anything, only checkout.
permissions:
  contents: read

jobs:
  # unit tests and lint
  #
  # `npm run lint` lives here rather than in a job of its own on purpose:
  # `units` is already a required status check on `main` / `releases/*`
  # (ruleset "protected-refs"), so folding lint into it makes lint blocking
  # without touching the ruleset's required-check list. A separate `lint` job
  # would report a check that nothing requires, which is the failure mode this
  # repo has already been bitten by.
  units:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # --ignore-scripts: this job runs on pull_request against PR-supplied
    # package.json/package-lock.json, so we must not execute arbitrary
    # install-time lifecycle scripts from untrusted PR content.
    - run: npm ci --ignore-scripts
    - run: npm test
    # After the tests, so that a lint failure never hides a real test failure.
    - run: npm run lint

  # Test the action works running from the graph.
  #
  # Runs on `push` only -- i.e. on main and releases/* after a PR has landed --
  # never on `pull_request`. `uses: ./` executes *this run's own*
  # dist/index.js with TEST_GITHUB_TOKEN, so the question is which code may
  # run with the token. The answer is "only code that already landed through
  # a PR":
  #
  #   * The `e2e-tests` environment has a deployment branch policy of `main`
  #     and `releases/*` and no required reviewer. A job on any other ref that
  #     names this environment is refused before it starts, so editing this
  #     workflow on a branch (e.g. dropping the `if:` below) cannot reach the
  #     secret. The `if:` only stops PR runs from showing up as failed
  #     deployments.
  #   * `main` and `releases/*` are covered by the `protected-refs` ruleset
  #     (pull request required, no bypass actors), so a push there only ever
  #     executes code that landed through a PR.
  #   * Fork PRs never receive secrets at all -- GitHub does not pass them to
  #     `pull_request` runs from a fork.
  #
  # This replaced a required-reviewer gate on PR runs. With one maintainer that
  # gate was self-approval, and on Dependabot PRs it gated nothing: runs
  # Dependabot triggers cannot read Actions or environment secrets, so the
  # token-dependent steps skipped after every approval. The cost of the change
  # is that an e2e failure surfaces after merge rather than before; consumers
  # pin tags or SHAs, and RELEASING.md requires a green run on main before
  # tagging, so a red main never reaches them.
  #
  # Threat model notes, in the order people tend to ask about them:
  #
  #   * TEST_GITHUB_TOKEN is a fine-grained PAT limited to this one repository
  #     with `Administration: Read` and nothing else. That is the least the
  #     runners API accepts for `repos/{owner}/{repo}/actions/runners`, which
  #     is the path this action takes when no `organization` / `enterprise`
  #     input is given. It cannot be replaced by GITHUB_TOKEN: the workflow
  #     `permissions:` key has no `administration` scope.
  #   * It is an *environment* secret, deliberately not a repository secret. A
  #     repository secret is readable by any run on any branch; the
  #     environment's branch policy is what keeps it on main / releases/*.
  #   * Do not switch this workflow to `pull_request_target`: that would run
  #     with secrets in the base repo's context on fork PRs.
  #   * DO NOT register a self-hosted runner on this repository. `test-output`
  #     below runs on whatever labels this action resolves, and with zero
  #     runners registered that can only ever be the fallback. Registering one
  #     would let labels chosen by a PR place a job on our own hardware.
  #
  # When TEST_GITHUB_TOKEN isn't configured (e.g. a fork's own main), the
  # token-dependent steps are skipped rather than failing, so this job doesn't
  # become a permanently-red check that trains reviewers to ignore CI. A token
  # that is present but expired or revoked is a different case and fails
  # loudly with a 401 -- that is intended, a dead token should be noisy rather
  # than silently skipped.
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: e2e-tests
    outputs:
      use-runner: ${{ steps.test-action.outputs.use-runner }}
    steps:
    - name: Check TEST_GITHUB_TOKEN availability
      id: check-token
      env:
        TOKEN_SET: ${{ secrets.TEST_GITHUB_TOKEN != '' }}
      run: echo "has-token=$TOKEN_SET" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.check-token.outputs.has-token == 'true'
    - id: test-action
      if: steps.check-token.outputs.has-token == 'true'
      uses: ./
      with:
        primary-runner: 'self-hosted,linux'
        fallback-runner: 'ubuntu-latest'
        github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
    - name: Check output
      if: steps.check-token.outputs.has-token == 'true'
      run: echo "Runner to use is ${{ steps.test-action.outputs.use-runner }}"
    - name: Skip notice
      if: steps.check-token.outputs.has-token != 'true'
      run: echo "::notice::TEST_GITHUB_TOKEN is not configured on this repo/fork; skipping token-dependent steps in the 'test' job."

  # This repository has zero registered runners, so `use-runner` always
  # resolves to the fallback and this job always lands on a GitHub-hosted
  # runner — see the "DO NOT register a self-hosted runner" note above for why
  # that must stay true. It reads no secrets, so it deliberately does not join
  # the `e2e-tests` environment; it runs only when `test` ran (push only).
  test-output:
    needs: test
    # test's steps are skipped whenever the secret is absent, which leaves
    # use-runner empty; guard against fromJson('') rather than failing.
    if: needs.test.outputs.use-runner != ''
    runs-on: ${{ fromJson(needs.test.outputs.use-runner) }}
    steps:
      - name: Do something
        run: echo "Doing something on ${{ needs.test.outputs.use-runner }}"

  # Same rationale, same gate, same skip behavior as `test` above — read that
  # comment block before changing anything here.
  test-multiple-labels:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: e2e-tests
    outputs:
      use-runner: ${{ steps.test-action.outputs.use-runner }}
    steps:
    - name: Check TEST_GITHUB_TOKEN availability
      id: check-token
      env:
        TOKEN_SET: ${{ secrets.TEST_GITHUB_TOKEN != '' }}
      run: echo "has-token=$TOKEN_SET" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.check-token.outputs.has-token == 'true'
    - id: test-action
      if: steps.check-token.outputs.has-token == 'true'
      uses: ./
      with:
        primary-runner: 'self-hosted,linux'
        fallback-runner: 'linux,x64'
        github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
    - name: Check output
      if: steps.check-token.outputs.has-token == 'true'
      run: echo "Runner to use is ${{ steps.test-action.outputs.use-runner }}"
    - name: Skip notice
      if: steps.check-token.outputs.has-token != 'true'
      run: echo "::notice::TEST_GITHUB_TOKEN is not configured on this repo/fork; skipping token-dependent steps in the 'test-multiple-labels' job."
