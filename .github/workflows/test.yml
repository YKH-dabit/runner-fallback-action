name: "units-test"
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

# Least-privilege default: no job here needs to write anything, only checkout.
permissions:
  contents: read

jobs:
  # unit tests
  units:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # --ignore-scripts: this job runs on pull_request against PR-supplied
    # package.json/package-lock.json, so we must not execute arbitrary
    # install-time lifecycle scripts from untrusted PR content.
    - run: npm ci --ignore-scripts
    - run: npm test

  # Test the action works running from the graph.
  #
  # Runs on both `pull_request` and `push`, gated behind the `e2e-tests`
  # environment whose only protection rule is a required reviewer. There is no
  # `if:` on the event: this workflow triggers on exactly those two events, so
  # the gate here is the environment, not the trigger.
  #
  # `uses: ./` executes *this run's own* dist/index.js, so approving this job
  # hands TEST_GITHUB_TOKEN to whatever code the run checked out. That is
  # exactly why the environment exists: the run stops before the job starts and
  # the secret stays unreadable until a human approves it.
  #
  # BEFORE APPROVING, read the run's diff to `dist/`, `package.json` scripts
  # and `.github/workflows/`. What is being approved is not "is this change a
  # good idea" but "am I willing to run this code with the token".
  #
  # Threat model notes, in the order people tend to ask about them:
  #
  #   * Fork PRs never receive secrets at all — GitHub does not pass them to
  #     `pull_request` runs from a fork — so the token-dependent steps below
  #     simply skip there. The environment gate is what protects *same-repo*
  #     branches.
  #   * TEST_GITHUB_TOKEN is a fine-grained PAT limited to this one repository
  #     with `Administration: Read` and nothing else. That is the least the
  #     runners API accepts for `repos/{owner}/{repo}/actions/runners`, which
  #     is the path this action takes when no `organization` / `enterprise`
  #     input is given. It cannot be replaced by GITHUB_TOKEN: the workflow
  #     `permissions:` key has no `administration` scope.
  #   * It is an *environment* secret, deliberately not a repository secret. A
  #     repository secret is readable by any run on any branch, which would put
  #     the token back within reach of unreviewed code and make this gate
  #     decorative.
  #   * `main` and `releases/*` are covered by the `protected-refs` ruleset
  #     (pull request required, no bypass actors), so the `push` runs here only
  #     ever execute code that landed through a PR.
  #   * DO NOT register a self-hosted runner on this repository. `test-output`
  #     below runs on whatever labels this action resolves, and with zero
  #     runners registered that can only ever be the fallback. Registering one
  #     would let labels chosen by a PR place a job on our own hardware.
  #
  # When TEST_GITHUB_TOKEN isn't configured (e.g. a fork, or a clone that
  # hasn't been given the secret), the token-dependent steps are skipped rather
  # than failing, so this job doesn't become a permanently-red check that
  # trains reviewers to ignore CI. A token that is present but expired or
  # revoked is a different case and fails loudly with a 401 — that is
  # intended, a dead token should be noisy rather than silently skipped.
  test:
    runs-on: ubuntu-latest
    environment: e2e-tests
    outputs:
      use-runner: ${{ steps.test-action.outputs.use-runner }}
    steps:
    - name: Check TEST_GITHUB_TOKEN availability
      id: check-token
      env:
        TOKEN_SET: ${{ secrets.TEST_GITHUB_TOKEN != '' }}
      run: echo "has-token=$TOKEN_SET" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.check-token.outputs.has-token == 'true'
    - id: test-action
      if: steps.check-token.outputs.has-token == 'true'
      uses: ./
      with:
        primary-runner: 'self-hosted,linux'
        fallback-runner: 'ubuntu-latest'
        github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
    - name: Check output
      if: steps.check-token.outputs.has-token == 'true'
      run: echo "Runner to use is ${{ steps.test-action.outputs.use-runner }}"
    - name: Skip notice
      if: steps.check-token.outputs.has-token != 'true'
      run: echo "::notice::TEST_GITHUB_TOKEN is not configured on this repo/fork; skipping token-dependent steps in the 'test' job."

  # This repository has zero registered runners, so `use-runner` always
  # resolves to the fallback and this job always lands on a GitHub-hosted
  # runner — see the "DO NOT register a self-hosted runner" note above for why
  # that must stay true. It reads no secrets, so it deliberately does not join
  # the `e2e-tests` environment and needs no approval of its own.
  test-output:
    needs: test
    # test's steps are skipped whenever the secret is absent, which leaves
    # use-runner empty; guard against fromJson('') rather than failing.
    if: needs.test.outputs.use-runner != ''
    runs-on: ${{ fromJson(needs.test.outputs.use-runner) }}
    steps:
      - name: Do something
        run: echo "Doing something on ${{ needs.test.outputs.use-runner }}"

  # Same rationale, same gate, same skip behavior as `test` above — read that
  # comment block before changing anything here.
  test-multiple-labels:
    runs-on: ubuntu-latest
    environment: e2e-tests
    outputs:
      use-runner: ${{ steps.test-action.outputs.use-runner }}
    steps:
    - name: Check TEST_GITHUB_TOKEN availability
      id: check-token
      env:
        TOKEN_SET: ${{ secrets.TEST_GITHUB_TOKEN != '' }}
      run: echo "has-token=$TOKEN_SET" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: steps.check-token.outputs.has-token == 'true'
    - id: test-action
      if: steps.check-token.outputs.has-token == 'true'
      uses: ./
      with:
        primary-runner: 'self-hosted,linux'
        fallback-runner: 'linux,x64'
        github-token: ${{ secrets.TEST_GITHUB_TOKEN }}
    - name: Check output
      if: steps.check-token.outputs.has-token == 'true'
      run: echo "Runner to use is ${{ steps.test-action.outputs.use-runner }}"
    - name: Skip notice
      if: steps.check-token.outputs.has-token != 'true'
      run: echo "::notice::TEST_GITHUB_TOKEN is not configured on this repo/fork; skipping token-dependent steps in the 'test-multiple-labels' job."
