# SCRATCH FILE - DO NOT MERGE.
#
# Exists only to prove that the `actions` CodeQL analysis added in #11 actually
# reports something. The `run:` step below interpolates a pull request title
# straight into a shell command, which is the textbook script-injection pattern
# (`actions/script-injection`). `workflow_dispatch` only, so nothing ever
# executes it - CodeQL analyses the file statically either way.
name: "SCRATCH: deliberate script injection"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deliberately-unsafe:
    runs-on: ubuntu-latest
    steps:
      - name: Interpolate untrusted input into a shell command
        run: echo "Title is ${{ github.event.pull_request.title }}"
