# `dist/index.js` is a special file in Actions.
# When you reference an action with `uses:` in a workflow,
# `index.js` is the code that will run.
# For our project, we generate this file through a build process from other source files.
# We need to make sure the checked-in `index.js` actually matches what we expect it to be.
name: Check dist/

on:
  # `paths-ignore` is fine here: nothing requires this run.
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  # No `paths-ignore` on `pull_request`, deliberately. `check-dist` is a
  # required status check on `main` and `releases/*` (repository ruleset
  # "protected-refs"), and a path filter stops the workflow from triggering
  # at all -- so the required check never reports and a Markdown-only PR
  # sits on "Expected -- waiting for status" forever, unmergeable. Note the
  # difference from the token-gated jobs in test.yml: a job skipped by an
  # `if:` condition still reports a (successful) conclusion, so those are
  # safe to gate; a workflow skipped by a path filter reports nothing at
  # all. Keep this trigger unfiltered for as long as `check-dist` is a
  # required check.
  pull_request:
  workflow_dispatch:

# Least-privilege default: this job only reads and compares files, it never
# pushes or writes anything back to the repo.
permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Install dependencies
        # --ignore-scripts: this job runs on pull_request against PR-supplied
        # package.json/package-lock.json; dist/ is rebuilt via the explicit
        # `npm run prepare` step below, not an install lifecycle hook, so we
        # don't need to execute arbitrary install-time scripts from
        # untrusted PR content.
        run: npm ci --ignore-scripts

      - name: Rebuild the dist/ directory
        run: npm run prepare

      - name: Compare the expected and actual dist/ directories
        run: |
          if [ "$(git diff --ignore-space-at-eol dist/ | wc -l)" -gt "0" ]; then
            echo "Detected uncommitted changes after build.  See status below:"
            git diff
            exit 1
          fi
        id: diff

      # If index.js was different than expected, upload the expected version as an artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/
