# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
# ******** WHEN THIS RUNS ********
# Every pull request, every push to `main`, and once a week on a schedule.
#
# The history is worth keeping, because the gap this closes was invisible rather
# than obvious. While this repository was private and had no Code Security /
# GHAS entitlement, `Perform CodeQL Analysis` always failed at the SARIF-upload
# step -- the scan itself ran to completion (extraction, autobuild, query
# evaluation) and only the upload call 403'd -- so the workflow was cut back to
# `workflow_dispatch` only rather than burning CI on a report that could never
# be uploaded. The consequence is the part worth remembering: the Security tab's
# JavaScript results were *empty*, not *clean*. An absent finding proved nothing.
#
# Code scanning is free on public repositories and this repository is public, so
# that constraint is gone and the triggers are restored.
#
# The weekly `schedule` earns its place even though `push` and `pull_request`
# already cover new code: CodeQL's queries and the advisory data behind them
# keep changing, so a scheduled run can surface a finding in code that nobody
# has touched.
#
# Note what this workflow does and does not gate: `analyze` uploads results and
# still succeeds when it finds something. Alerts land in the Security tab and on
# the PR through code scanning's own "Code scanning results" check -- that
# check, not this workflow's conclusion, is what can hold up a merge.
#
name: "CodeQL"

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 07:23 UTC. Deliberately off the hour -- scheduled runs
    # queue behind everyone else's on-the-hour crons.
    - cron: '23 7 * * 1'
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # `actions` analyses the workflow files themselves. Worth having on a
        # repository that *is* a GitHub Action, where the workflows are as much
        # of the attack surface as index.js: script injection through untrusted
        # inputs, over-broad triggers, unpinned third-party actions.
        language: [ 'javascript', 'actions' ]
        # Learn more about CodeQL language support at https://git.io/codeql-language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
